name: workspace

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.45.3
    restart: unless-stopped
    ports:
      - "9443:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  dbgate:
    container_name: dbgate
    image: dbgate/dbgate:7.3.4
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dbgate_config:/root/.dbgate

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:9.0.4
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.8.4
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: rustfs
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: sandbox:26.13.0
    container_name: sandbox
    restart: unless-stopped
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - ${HOST_WORKSPACES_PATH}:/workspace
      - sandbox_data:/root

networks:
  default:
    name: workspace
    driver: bridge

volumes:
  portainer_data:
  dbgate_config:
  postgres_data:
  mongodb_data:
  redis_data:
  rustfs_data:
  sandbox_data:
