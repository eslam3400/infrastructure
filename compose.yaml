name: infrastructure

services:
  traefik:
    container_name: traefik
    image: traefik:v3.7.17
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=infrastructure
      # HTTP/HTTPS entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Let's Encrypt
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/certs/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/certs
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`traefik.${DOMAIN}`)"
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls.certresolver: le
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth
      traefik.http.middlewares.dashboard-auth.basicauth.users: "${TRAEFIK_DASHBOARD_USERS}"

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.45.3
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/portainer.png
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: "Host(`portainer.${DOMAIN}`)"
      traefik.http.routers.portainer.entrypoints: websecure
      traefik.http.routers.portainer.tls.certresolver: le
      traefik.http.services.portainer.loadbalancer.server.port: "9000"

  dbgate:
    container_name: dbgate
    image: dbgate/dbgate:7.3.4
    restart: unless-stopped
    environment:
      - LOGIN=${DBGATE_LOGIN}
      - PASSWORD=${DBGATE_PASSWORD}
    volumes:
      - dbgate_config:/root/.dbgate
    labels:
      icon: https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-universal-apps/apps/dbgate/logo.png
      traefik.enable: "true"
      traefik.http.routers.dbgate.rule: "Host(`dbgate.${DOMAIN}`)"
      traefik.http.routers.dbgate.entrypoints: websecure
      traefik.http.routers.dbgate.tls.certresolver: le
      traefik.http.services.dbgate.loadbalancer.server.port: "3000"

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:9.0.4
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.8.4
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: rustfs
    restart: unless-stopped
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE}
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      traefik.enable: "true"
      # Console UI
      traefik.http.routers.rustfs-console.rule: "Host(`storage.${DOMAIN}`)"
      traefik.http.routers.rustfs-console.entrypoints: websecure
      traefik.http.routers.rustfs-console.tls.certresolver: le
      traefik.http.routers.rustfs-console.service: rustfs-console-svc
      traefik.http.services.rustfs-console-svc.loadbalancer.server.port: "9001"
      # S3 API
      traefik.http.routers.rustfs-s3.rule: "Host(`s3.${DOMAIN}`)"
      traefik.http.routers.rustfs-s3.entrypoints: websecure
      traefik.http.routers.rustfs-s3.tls.certresolver: le
      traefik.http.routers.rustfs-s3.service: rustfs-s3-svc
      traefik.http.services.rustfs-s3-svc.loadbalancer.server.port: "9000"

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: sandbox:26.13.0
    container_name: sandbox
    restart: unless-stopped
    command: sleep infinity
    working_dir: /workspace
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
    volumes:
      - ${HOST_WORKSPACES_PATH}:/workspace
      - sandbox_data:/root
    labels:
      traefik.enable: "true"
      traefik.http.routers.opencode.rule: "Host(`opencode.${DOMAIN}`)"
      traefik.http.routers.opencode.entrypoints: websecure
      traefik.http.routers.opencode.tls.certresolver: le
      traefik.http.services.opencode.loadbalancer.server.port: "4096"

networks:
  default:
    name: infrastructure
    driver: bridge

volumes:
  traefik_certs:
  portainer_data:
  dbgate_config:
  postgres_data:
  mongodb_data:
  redis_data:
  rustfs_data:
  sandbox_data:
