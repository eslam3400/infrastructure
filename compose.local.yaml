name: infrastructure

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce
    restart: unless-stopped
    ports:
      - "9443:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  dbgate:
    container_name: dbgate
    image: dbgate/dbgate
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dbgate_config:/root/.dbgate

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.8.1
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  flyakeed-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: sandbox-base:latest
    container_name: flyakeed-sandbox
    restart: unless-stopped
    user: "0:1000"
    command: sleep infinity
    working_dir: /workspaces/flyakeed
    volumes:
      - ${FLYAKEED_WORKSPACES_PATH}:/workspaces/flyakeed
      - flyakeed-sandbox:/root

  vectora-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: sandbox-base:latest
    container_name: vectora-sandbox
    restart: unless-stopped
    user: "0:1000"
    command: sleep infinity
    working_dir: /workspaces/vectora
    volumes:
      - ${VECTORA_WORKSPACES_PATH}:/workspaces/vectora
      - vectora-sandbox:/root

  personal-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: sandbox-base:latest
    container_name: personal-sandbox
    restart: unless-stopped
    user: "0:1000"
    command: sleep infinity
    working_dir: /workspaces/personal
    ports:
      - "9229:9119"
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_PASSWORD}
    volumes:
      - ${PERSONAL_WORKSPACES_PATH}:/workspaces/personal
      - personal-sandbox:/root

networks:
  default:
    name: infrastructure
    driver: bridge

volumes:
  portainer_data:
  dbgate_config:
  postgres_data:
  mongodb_data:
  redis_data:
  rustfs_data:
  flyakeed-sandbox:
  vectora-sandbox:
  personal-sandbox:
